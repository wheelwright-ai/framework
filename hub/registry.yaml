---
# Registry: Expertise Map for Self-Aware Help Routing
# Each node declares what it offers and what it subscribes to
# /help skill uses this to route questions to the right expert

version: 2.0
last_updated: "2026-03-12"
last_updated_by: "Claude Sonnet 4.6"

nodes:
  # Wheelwright Core Projects
  - path: "wheelwright/framework"
    type: spoke
    status: active
    framework_version: "2.0.0"
    role: "Framework Authority"
    description: "Core WAI framework — skills, lugs, architecture"

    lens: "Technical authority on WAI mechanics, agent colony patterns, teaching file formats"

    offers:
      - capability: "WAI framework guidance"
        scope: "How to use skills, lugs, teaching files, registry routing"
      - capability: "Teaching file specification"
        scope: "Best practices for creating versioned, self-documenting teaching files"
      - capability: "Skill definition and use cases"
        scope: "How to create and document skills with real scenarios"
      - capability: "Lug schema and decision records"
        scope: "Creating decisions, learning records, deficiency tracking"

    subscribes_to:
      - topic: "spoke-patterns"
        from: "hub"
        description: "Cross-spoke patterns, lessons learned"
      - topic: "help-requests"
        from: "all-spokes"
        description: "Questions spokes can't answer locally"

    contact_on:
      - pattern: "How do I use.*WAI|skills|lugs|teaching"
        description: "WAI framework questions"
      - pattern: "What is.*lug|skill|teaching file"
        description: "WAI mechanics questions"
      - pattern: "How do I create.*skill|teaching file|lug"
        description: "WAI creation questions"

  - path: "wheelwright/hub"
    type: hub
    status: active
    framework_version: "2.0.0"
    role: "Hub — Shared Knowledge & Orchestration"
    description: "Central knowledge store, cross-spoke pattern distribution"

    lens: "Cross-project patterns, shared learnings, architectural decisions affecting multiple spokes"

    offers:
      - capability: "Cross-spoke patterns"
        scope: "Patterns seen across multiple spokes, generalizable solutions"
      - capability: "Shared decision records"
        scope: "Architectural decisions affecting the whole wheel"
      - capability: "Observation synthesis"
        scope: "Trends across spokes (e.g., 'all spokes ask about X')"

    subscribes_to:
      - topic: "help-requests-unanswered"
        from: "all-spokes"
        description: "Questions no spoke could answer — framework should know"
      - topic: "local-learnings"
        from: "all-spokes"
        description: "Patterns worth sharing across spokes"

    contact_on:
      - pattern: "What.*patterns|other projects|how do.*spokes.*handle"
        description: "Cross-spoke pattern questions"
      - pattern: "Does anyone.*|Who else.*"
        description: "Hub-wide knowledge questions"

  - path: "wheelwright/website"
    type: spoke
    status: active
    framework_version: "2.0.0"
    role: "Marketing & Public Documentation"
    description: "Public-facing website, user documentation"

    lens: "How to present Wheelwright to users, marketing messaging, onboarding flow"

    offers:
      - capability: "User documentation generation"
        scope: "Automatic doc site generation from framework state"
      - capability: "Marketing strategy"
        scope: "How to position/explain Wheelwright features"
      - capability: "User onboarding flow"
        scope: "Getting new users started quickly"

    subscribes_to:
      - topic: "framework-updates"
        from: "wheelwright/framework"
        description: "New framework features to document"
      - topic: "teaching-files"
        from: "wheelwright/framework"
        description: "New teaching files to integrate into docs"

    contact_on:
      - pattern: "How do users.*|marketing|onboarding|documentation site"
        description: "User-facing questions"

  # Active Projects
  - path: "ezorg/email"
    type: spoke
    status: active
    framework_version: "2.0.0"
