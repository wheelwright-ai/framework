# Registry Features
help_routing_rules:
  - rule: "Question starts with 'How do I...?'"
    logic: "Search local → Match contact_on patterns → Route to best expert"
  - rule: "Question is 'What is...?'"
    logic: "Search local EXTENSION.md + BRIEF → If not found, route to framework or hub"
  - rule: "Question references specific project"
    logic: "Look up project in registry → Ask that project directly"
  - rule: "Question not matched by any contact_on"
    logic: "Create help-request lug, submit to hub"

registry_notes:
  - "Each active spoke declares what it offers (expertise) and subscribes to (what it needs)"
  - "/help skill uses 'contact_on' patterns to route questions to right expert"
  - "If no spoke matches, hub becomes the destination (cross-spoke or framework learning questions)"
  - "Unanswered help-requests create lugs that framework uses to create new teaching files"
  - "Registry is self-documenting; each node's role/lens/offers tell you who to ask about what"
