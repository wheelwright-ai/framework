    description: "Email organization and automation"

    lens: "Email workflows, inbox management, automation rules"

    offers:
      - capability: "Email system architecture"
        scope: "Email processing, storage, workflow patterns"
      - capability: "Automation patterns"
        scope: "How to build email automation systems"

    subscribes_to:
      - topic: "framework-updates"
        from: "wheelwright/framework"
        description: "New WAI features"
      - topic: "shared-patterns"
        from: "wheelwright/hub"
        description: "Cross-spoke patterns"

    contact_on:
      - pattern: "email|inbox|automation"
        description: "Email system questions"

