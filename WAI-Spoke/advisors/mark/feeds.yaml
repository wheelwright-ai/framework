refresh_interval_days: 7
keep_snapshots: 5

feeds:
  - id: analytics-tools
    type: web_search
    query: "product analytics A/B testing tools Python 2026 open source"
    max_results: 5
    description: "Analytics and experimentation tooling updates (product spokes only)"
    required: false

  - id: synthesis
    type: ai_synthesis
    depends_on: [analytics-tools]
    model: claude-haiku-4-5
    description: "Growth analytics advisory brief for product spokes"
    required: false
