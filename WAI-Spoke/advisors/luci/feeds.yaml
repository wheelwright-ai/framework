refresh_interval_days: 7
keep_snapshots: 5

feeds:
  - id: python-advisories
    type: web_fetch
    url: "https://github.com/advisories?query=ecosystem%3Apip+severity%3Ahigh&state=published"
    description: "High-severity Python dependency security advisories"
    required: false

  - id: synthesis
    type: ai_synthesis
    depends_on: [python-advisories]
    model: claude-haiku-4-5
    description: "Uptime and dependency risk brief"
    required: false
