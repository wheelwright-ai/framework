  - id: "taste-collab-001"
    category: "workflow"
    preference: "When producing a plan: create an epic lug, tell user the name, dogfood via minimal agent, show result, iterate until clean. Closeout+restart is context management, not a protocol step — do it when the window needs it. When asking for Green Light: always include challenge (what could go wrong / what this costs) and value (what this delivers if implemented)."
    status: "accepted"
    source: "user-direct"
    proposed_at: "2026-03-14T09:03:00Z"
    accepted_at: "2026-03-14T09:03:00Z"
  - id: "taste-hist-001"
    category: "communication"
    preference: "Minimize narration before action. When executing a known plan or Green Light task, start with a 1-line status then act. Reserve prose for genuinely new decisions or unexpected findings."
    status: "accepted"
    source: "historian-pass-20260315-0601"
    proposed_at: "2026-03-15T06:01:00Z"
    accepted_at: "2026-03-15T06:10:00Z"
  - id: "taste-hist-002"
    category: "workflow"
    preference: "In the track point decisions[] array: only record architectural or technical choices that affect future behavior. Do NOT record: session IDs, 'previous session clean closeout', 'new session: X'. Those are log entries, not decisions."
    status: "accepted"
    source: "historian-pass-20260315-0601"
